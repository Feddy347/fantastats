name: Update Serie A data

on:
  schedule:
    # 01:00 UTC ~= 02:00 Europe/Rome (CET, winter). GitHub Actions cron has
    # no timezone/DST support, so during CEST (summer, UTC+2) this actually
    # fires at 03:00 local instead of 02:00 - the closest fixed-UTC
    # approximation available without a second seasonal cron entry.
    - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  update-serie-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: node scripts/update-serie-a-data.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      # Must run after update-serie-a-data.js in the same job so it always
      # sees freshly-synced serie_a_fixtures — see AUDIT_REPORT.md §9.1.
      - run: node scripts/advance-gameweeks.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
